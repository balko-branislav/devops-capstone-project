name: Capstone CI/CD - Build and Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Krok - Stiahnutie kódu
        uses: actions/checkout@v4

      - name: 2. Krok - Prihlásenie do Docker Hubu
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Krok - Zostavenie a Publikovanie Docker Obrazu
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-capstone-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-capstone-app:${{ github.sha }}
